apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: block-host-namespaces
spec:
  validationFailureAction: Enforce
  rules:
  - name: block-host-namespaces
    match:
      any:
      - resources:
          kinds:
          - Pod
    exclude:
      any:
      - resources:
          namespaces:
          - falco
          - kube-system
          - monitoring
          - istio-system
          - trivy-system
          - kyverno
    validate:
      message: "Host namespaces (hostNetwork, hostPID, hostIPC) are not allowed."
      pattern:
        spec:
          =(hostNetwork): "false"
          =(hostPID): "false"
          =(hostIPC): "false"
